name: CI

on:
  - push
  - pull_request

jobs:
  cabal:
    name: ${{ matrix.os }} / ghc ${{ matrix.ghc }} / openapi3 ${{ matrix.openapi3 }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ghc:
          - "9.12.1"
        openapi3:
          - "3.2.4"
          - "3.2.5"

    steps:
    - uses: actions/checkout@v3

    - uses: haskell-actions/setup@v2.7.9
      id: setup-haskell-cabal
      name: Setup Haskell
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: '3.18.1.0'

    - name: Update Cabal Index
      run: |
        cabal update

    - name: Configure
      run: |
        cabal configure --enable-tests --enable-benchmarks --test-show-details=direct --write-ghc-environment-files=always --constraint="openapi3 == ${{ matrix.openapi3 }}"

    - name: Freeze
      run: |
        cabal freeze

    - uses: actions/cache@v3
      name: Cache ~/.cabal/store
      with:
        path: ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}

    - name: Install dependencies
      run: |
        cabal build --enable-tests --enable-benchmarks --dependencies-only -j2 all

    - name: Test
      run: |
        cabal test all
